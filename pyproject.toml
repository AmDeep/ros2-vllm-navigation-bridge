[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ros2-vllm-navigation-bridge"
version = "0.1.0"
description = "Safety-bounded ROS 2 navigation control with a vLLM semantic-planning boundary"
requires-python = ">=3.11"

[project.scripts]
ros2-navigation-replay = "navigation_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
