<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">ROS 2 vLLM navigation architecture</title><desc id="desc">A vLLM semantic planner feeds a waypoint into a bounded controller that reads odometry and publishes cmd_vel.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#475569"/></marker></defs><rect width="1100" height="520" fill="#f8fafc"/><text x="48" y="58" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="#0f172a">ROS 2 vLLM Navigation Bridge</text><text x="48" y="88" font-family="Segoe UI,Arial" font-size="16" fill="#475569">Language-level intent stays outside the real-time velocity loop.</text><rect x="50" y="155" width="220" height="140" rx="16" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/><text x="160" y="200" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#312e81">vLLM planner</text><text x="160" y="235" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#3730a3">mission -&gt; waypoint</text><text x="160" y="264" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#3730a3">optional service</text><rect x="410" y="135" width="280" height="180" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="550" y="180" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#92400e">Bounded controller</text><text x="550" y="218" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#92400e">pose + goal</text><text x="550" y="245" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#92400e">P heading control</text><text x="550" y="272" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#92400e">velocity clamps</text><rect x="830" y="155" width="220" height="140" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="940" y="200" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#166534">ROS 2 robot</text><text x="940" y="235" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#166534">/odom input</text><text x="940" y="264" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#166534">/cmd_vel output</text><path d="M270 225 H402" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><path d="M698 225 H822" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><path d="M940 305 V370 H550 V325" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><text x="748" y="360" font-family="Segoe UI,Arial" font-size="15" fill="#475569">odometry feedback</text><rect x="50" y="400" width="1000" height="62" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="76" y="438" font-family="Segoe UI,Arial" font-size="17" fill="#334155">Safety property: no goal or no odometry means zero command, never an inferred motion target.</text></svg>
